# Publishes server.json to the official MCP Registry when a release is tagged.
#
# The package is published to npm by hand from the source repo first, then
# mirrored here with a v<version> tag (scripts/mirror-mcp.sh), which runs
# this. The registry checks that the npm version exists and that its mcpName
# matches server.json's name.
#
# The name is ai.skyelight/mcp (from 1.1.0), so the registry wants proof we
# own skyelight.ai: a TXT record on the apex, "v=MCPv1; k=ed25519; p=...",
# and the matching private key as the MCP_PRIVATE_KEY secret (hex). Until
# 1.0.0 the name was io.github.plastrlab/skyelight-mcp, proved by GitHub
# OIDC; the last step marks that old entry deprecated, once.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check the versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          srv="$(jq -r .version server.json)"
          npmv="$(jq -r '.packages[0].version' server.json)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json $pkg"; exit 1
          fi
          if [ "$pkg" != "$srv" ] || [ "$pkg" != "$npmv" ]; then
            echo "package.json $pkg, server.json $srv, server.json package $npmv"; exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (skyelight.ai DNS)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "MCP_PRIVATE_KEY is not set. See the comment at the top of this file."; exit 1
          fi
          ./mcp-publisher login dns --domain skyelight.ai --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        run: ./mcp-publisher publish

      # The pre-1.1.0 name. Its namespace is proved by GitHub OIDC, not the
      # domain, so it needs its own login. Skipped once it is deprecated.
      - name: Deprecate io.github.plastrlab/skyelight-mcp
        run: |
          old="io.github.plastrlab/skyelight-mcp"
          status="$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=$old" \
            | jq -r --arg n "$old" '[.servers[] | select(.server.name == $n) | ._meta["io.modelcontextprotocol.registry/official"].status] | first // "missing"')"
          echo "$old is $status"
          if [ "$status" = active ]; then
            ./mcp-publisher login github-oidc
            ./mcp-publisher status --status deprecated --all-versions \
              --message "Renamed to ai.skyelight/mcp. Same server, same npm package." "$old"
          fi
